upstream gym_backend {
    server web:8000;
}

server {
    listen 80;
    server_name api.fitverx.com 16.171.26.53 localhost 127.0.0.1;

    # Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.fitverx.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.fitverx.com;

    ssl_certificate /etc/letsencrypt/live/api.fitverx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fitverx.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location / {
        proxy_pass http://gym_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Static files - Served directly by Nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Media files - Served directly by Nginx
    location /media/ {
        alias /app/mediafiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
