<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <h2 style="color: #4CAF50; text-align: center;">Reset Your Password</h2>
        <p>Hello,</p>
        <p>We received a request to reset the password for your account. Please use the following One-Time Password (OTP) to proceed:</p>
        
        <div style="text-align: center; margin: 30px 0;">
            <span style="display: inline-block; font-size: 24px; font-weight: bold; background-color: #f4f4f4; padding: 10px 20px; border-radius: 5px; letter-spacing: 2px;">
                {{ code }}
            </span>
        </div>
        
        <p>This code will expire in 5 minutes. If you did not request a password reset, you can safely ignore this email.</p>
        
        <p>Best regards,<br>The Team</p>
    </div>
</body>
</html>
